name: Market Alerts

on:
  schedule:
    # Runs at 20:15 UTC (4:15 PM US Eastern Time) Monday-Friday
    - cron: '15 20 * * 1-5'
  workflow_dispatch: # Allows you to manually click a button to test it

jobs:
  check-market:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Libraries
        run: pip install yfinance pandas numpy

      - name: Run Alert Engine
        run: python check_alerts.py
